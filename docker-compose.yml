services:

  devenv:
    build:
      dockerfile: ./docker/devenv.dockerfile
      context: ./
    environment:
      DISPLAY: host.docker.internal:0
    ports:
      - "5000:5000"
    volumes:
      - type: bind
        source: ./
        target: /target
      # for xwindows
      #- type: bind
      #  source: /tmp/.X11-unix
      #  target: /tmp/.X11-unix